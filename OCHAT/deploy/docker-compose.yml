services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      MYSQL_DATABASE: ${OCHAT_DB_NAME:-ochat}
      MYSQL_USER: ${OCHAT_DB_USER:-ochat}
      MYSQL_PASSWORD: ${OCHAT_DB_PASSWORD:-change-me-strong-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  chat-server:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      OCHAT_DB_BACKEND: mysql
      OCHAT_DB_HOST: mysql
      OCHAT_DB_PORT: 3306
      OCHAT_DB_NAME: ${OCHAT_DB_NAME:-ochat}
      OCHAT_DB_USER: ${OCHAT_DB_USER:-ochat}
      OCHAT_DB_PASSWORD: ${OCHAT_DB_PASSWORD:-change-me-strong-password}
      OCHAT_UPLOAD_DIR: /app/database/uploads
    command: ["python", "start_server.py", "--host", "0.0.0.0", "--port", "8765"]
    volumes:
      - uploads:/app/database/uploads
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,socket; s=socket.create_connection(('127.0.0.1',8765),3); s.sendall(b'{\"action\":\"health\"}\\n'); data=s.recv(4096); s.close(); raise SystemExit(0 if b'\"ok\": true' in data else 1)"]
      interval: 15s
      timeout: 5s
      retries: 8

  web:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      chat-server:
        condition: service_healthy
    environment:
      OCHAT_PRODUCTION: "true"
      OCHAT_CHAT_HOST: chat-server
      OCHAT_CHAT_PORT: 8765
      OCHAT_ALLOWED_ORIGINS: ${OCHAT_ALLOWED_ORIGINS:-http://localhost:8080}
      OCHAT_SECURE_COOKIES: ${OCHAT_SECURE_COOKIES:-false}
    command: ["python", "start_web_client.py", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${OCHAT_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  mysql-data:
  uploads:
